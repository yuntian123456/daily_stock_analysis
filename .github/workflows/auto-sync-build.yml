name: 🚀 Auto Sync & Build DockerHub

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  # 任务1：专门同步 main 分支
  sync-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main # 明确指定操作 main 分支
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync Fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

  # 任务2：基于 main 分支构建镜像
  build-docker:
    needs: sync-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main # 确保构建的是刚刚同步好的 main 分支代码

      - name: Get latest release tag
        id: get_tag
        run: echo "latest_tag=$(curl -s https://api.github.com/repos/ZhuLinsen/daily_stock_analysis/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check_hub
        run: |
          URL="https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis/tags/${{ steps.get_tag.outputs.latest_tag }}/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "skip_build=$([ "$HTTP_STATUS" == "200" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis:${{ steps.get_tag.outputs.latest_tag }}
            