name: 🚀 Auto Sync & Build DockerHub

on:
  schedule:
    # 每天北京时间中午12点自动运行一次 (UTC时间4点)
    - cron: '0 4 * * *'
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  # 任务1：强制同步上游代码到你仓库的 main 分支
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork's main branch with Upstream
        # 使用 gh repo sync 命令，强行将原作者的最新代码覆盖到你自己的 main 分支
        run: gh repo sync ${{ github.repository }} --branch main --source ZhuLinsen/daily_stock_analysis --force
        env:
          # 【极其重要】这里必须使用你刚刚申请并存入 Secrets 的个人访问令牌 PAT_TOKEN，否则遇到上游改了 workflow 文件就会报错！
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  # 任务2：基于刚刚同步好的 main 分支代码构建 Docker 镜像
  build-docker:
    needs: sync-main # 强制等待任务1（同步）成功完成后，再开始任务2
    runs-on: ubuntu-latest
    steps:
      # 【关键】因为当前工作流运行在 ops 分支，所以必须显式指定拉取 main 分支的代码来进行构建
      - name: Checkout synced main branch code
        uses: actions/checkout@v4
        with:
          ref: main 

      # 获取原作者最新的正式版本号 (例如 v3.4.8)
      - name: Get latest release tag from upstream
        id: get_tag
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/ZhuLinsen/daily_stock_analysis/releases/latest | jq -r .tag_name)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag is: $LATEST_TAG"

      # 检查你的 Docker Hub 中是否已经打包过这个版本，避免重复打包
      - name: Check if image already exists on your Docker Hub
        id: check_hub
        run: |
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          TAG="${{ steps.get_tag.outputs.latest_tag }}"
          
          if [ "$TAG" == "null" ] || [ -z "$TAG" ]; then
            echo "❌ 无法获取上游最新 Tag，请检查原仓库状态。"
            exit 1
          fi

          # 调用 Docker Hub API 查询镜像是否存在
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/$USERNAME/daily_stock_analysis/tags/$TAG/")
          
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "🚀 镜像 $USERNAME/daily_stock_analysis:$TAG 已经存在，无需重新打包。"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "📦 发现新版本 $TAG！准备开始自动构建双架构镜像..."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      # 安装 QEMU 模拟器（用于跨架构编译 ARM）
      - name: Set up QEMU
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx（多架构构建依赖它）
      - name: Set up Docker Buildx
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v3

      # 登录你的 Docker Hub
      - name: Login to Docker Hub
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 编译并推送多架构镜像
      - name: Build and push multi-arch image to Docker Hub
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # ✨ 同时打包 amd64 和 arm64 两种架构
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis:${{ steps.get_tag.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

