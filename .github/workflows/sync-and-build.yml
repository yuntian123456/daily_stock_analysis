name: 🚀 Auto Sync & Build DockerHub

on:
  schedule:
    - cron: '0 4 * * *' # 每天北京时间中午12点
  workflow_dispatch:     # 支持手动触发

jobs:
  # 任务1：同步上游代码到当前仓库的 main 分支
  sync-fork:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限以同步代码
    steps:
      - name: Sync Fork
        run: gh repo sync ${{ github.repository }} --branch main --source ZhuLinsen/daily_stock_analysis --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 任务2：基于 main 分支构建镜像
  build-docker:
    needs: sync-fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # 确保检出的是最新的 main 分支

      # 获取上游最新 Tag 以命名镜像
      - name: Get latest release tag
        id: get_tag
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/ZhuLinsen/daily_stock_analysis/releases/latest | jq -r .tag_name)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # 检查镜像是否已存在（避免重复构建）
      - name: Check if image exists
        id: check_hub
        run: |
          TAG="${{ steps.get_tag.outputs.latest_tag }}"
          URL="https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis/tags/$TAG/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      # 如果需要构建，配置 Docker 环境并推送
      - name: Set up QEMU & Buildx
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check_hub.outputs.skip_build == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/daily_stock_analysis:${{ steps.get_tag.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
